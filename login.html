<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <title>Login</title>
</head>
<body>

  <div class="login-container">
    <img src="MINI IMG/MINicon.png" alt="icon">
    <h2>Login</h2>
    <form action="index.html" method="get">
      <input type="text" placeholder="Username or Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <a href="register.html">Don't have an account? Register</a>
  </div>
 
</body>

<script>
    const demoUsers = {
      'admin': 'admin123',
      'user@example.com': 'password123'
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      const successMsg = document.getElementById('successMessage');
      
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      
      if (username === '' || password === '') {
        showError('Please fill in all fields');
        return;
      }
      
      if (demoUsers[username] && demoUsers[username] === password) {
        showSuccess('Login successful! Redirecting...');
        
        const userData = {
          username: username,
          loginTime: new Date().toISOString()
        };
        
        setTimeout(function() {
          alert('Welcome, ' + username + '!\n\nIn a real application, you would be redirected to the home page.');
        }, 1500);
      } else {
        showError('Invalid username or password');
      }
    });
        function showError(message) {
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
    }
        function showSuccess(message) {
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = message;
      successMsg.style.display = 'block';
    }
        function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.password-toggle-btn');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = 'Show';
      }
    }
        document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
        console.log('Demo Login Credentials:');
    console.log('Username: admin | Password: admin123');
    console.log('Username: user@example.com | Password: password123');
  </script>
</html>
