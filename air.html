<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AIR COOLER - Subcategories</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
    }


    header {
      background: #2c3e50;
      color: white;
      padding: 20px 30px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 2px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }


    .cart-icon {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 16px;
      font-weight: bold;
      background: #ff9800;
      padding: 6px 14px;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .cart-icon:hover {
      background: #e67e22;
      color: #fff;
    }


    .container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 25px;
      padding: 40px 50px;
    }


    .subcategory {
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      text-align: center;
      padding: 20px;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .subcategory img {
      max-width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .subcategory h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #2c3e50;
    }

    .subcategory p {
      font-size: 15px;
      color: #555;
      margin-bottom: 12px;
    }

    .subcategory:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }


    button {
      background: #ff9800;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      font-size: 14px;
      transition: background 0.3s, transform 0.2s;
    }
    button:hover {
      background: #e67e22;
      transform: scale(1.05);
    }

    .btn-buy {
      background: #4caf50;
    }
    .btn-buy:hover {
      background: #2e7d32;
      transform: scale(1.05);
    }


    @media (max-width: 1200px) {
      .container {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>AIR COOLER</h1>
     <div class="cart-icon" onclick="window.location.href='cart.html'">
    🛒 Cart (<span id="cartCount">0</span>)
  </div>
</header>

<div class="container">

  <div class="subcategory">
    <img src="MINI IMG/AIR COOLER 1.jpg" alt="1">
    <h3>USHA AIRCOOLER</h3>
    <p>PRICE: RS 30,000</p>
    <div>
      <button onclick="addToCart('USHA AIRCOOLER', 30000, 'MINI IMG/AIR COOLER 1.jpg')">Add to Cart</button>
      <button class="btn-buy" onclick="buyNow('USHA AIRCOOLER', 30000, 'MINI IMG/AIR COOLER 1.jpg')">Buy Now</button>
    </div>
    </div>
  
  <div class="subcategory">
    <img src="MINI IMG/AIR COOLER 2.jpg" alt="2">
    <h3>BAJAJ AIRCOOLER</h3>
    <p>PRICE: RS 35,000</p>
    <div>
      <button onclick="addToCart('BAJAJ AIRCOOLER', 35000, 'MINI IMG/AIR COOLER 2.jpg')">Add to Cart</button>
      <button class="btn-buy" onclick="buyNow('BAJAJ AIRCOOLER', 35000, 'MINI IMG/AIR COOLER 2.jpg')">Buy Now</button>
    </div>
    </div>
  
  <div class="subcategory">
    <img src="MINI IMG/AIR COOLER 3.jpg" alt="3">
    <h3>CROMPTON AIRCOOLER</h3>
    <p>PRICE: RS 45,000</p>
    <div>
      <button onclick="addToCart('CROMPTON AIRCOOLER', 45000, 'MINI IMG/AIR COOLER 3.jpg')">Add to Cart</button>
      <button class="btn-buy" onclick="buyNow('CROMPTON AIRCOOLER', 45000, 'MINI IMG/AIR COOLER 3.jpg')">Buy Now</button>
    </div>
    </div>

   <div class="subcategory">
     <img src="MINI IMG/AIR COOLER 4.jpg" alt="4">
     <h3>SYMPHONY AIRCOOLER</h3>
     <p>PRICE: RS 40,000</p>
    <div>
      <button onclick="addToCart('SYMPHONY AIRCOOLER', 40000, 'MINI IMG/AIR COOLER 4.jpg')">Add to Cart</button>
      <button class="btn-buy" onclick="buyNow('SYMPHONY AIRCOOLER', 40000, 'MINI IMG/AIR COOLER 4.jpg')">Buy Now</button>
    </div>
     </div>

    <div class="subcategory">
      <img src="MINI IMG/AIR COOLER 5.jpg" alt="5">
      <h3>KENSTAR AIRCOOLER</h3>
      <p>PRICE: RS 60,000</p>
    <div>
      <button onclick="addToCart('KENSTAR AIRCOOLER', 60000, 'MINI IMG/AIR COOLER 5.jpg')">Add to Cart</button>
      <button class="btn-buy" onclick="buyNow('KENSTAR AIRCOOLER', 60000, 'MINI IMG/AIR COOLER 5.jpg')">Buy Now</button>
    </div>
      </div>

</div>
<script>
  function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("cartCount").innerText = cart.length;
  }

  function addToCart(name, price, image) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push({ name, price, image });
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    alert(name + " added to cart!");
  }

  function buyNow(name, price, image) {
    let cart = [{ name, price, image }];
    localStorage.setItem("cart", JSON.stringify(cart));
    window.location.href = "Paynow.html";
  }

  updateCartCount();
</script>
</body>
</html>
