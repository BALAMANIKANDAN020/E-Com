<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MOBILES - Subcategories</title>
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #f9f9f9;
  color: #333;
  line-height: 1.6;
}

header {
  background: #2c3e50;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 2px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
  padding: 40px 40px;
}

.subcategory {
  background: white;
  border-radius: 12px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  text-align: center;
  padding: 20px;
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}

.subcategory img {
  max-width: 100%;
  height: 160px;
  object-fit: contain;
  border-radius: 8px;
  margin-bottom: 15px;
}

.subcategory a {
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  color: #2c3e50;
  transition: color 0.3s;
}

.subcategory:hover {
  animation: shake 0.4s ease-in-out;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  background: #f0fdfb;
}

.subcategory:hover a {
  color: #1abc9c;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

@media (max-width: 500px) {
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 400px) {
  .container {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>
<body>

<header>
  <h1>MOBILES</h1>
</header>

<div class="container">

  <div class="subcategory">
    <img src="MINI IMG/VIVO.png" alt="1">
    <a href="vivo.html" class="card">VIVO</a>
  </div>
  
  <div class="subcategory">
    <img src="MINI IMG/OPPO.jpg" alt="2">
    <a href="oppo.html" class="card">OPPO</a>
  </div>
  
  <div class="subcategory">
    <img src="MINI IMG/SAMSUNG.png" alt="3">
    <a href="samsung.html" class="card">SAMSUNG</a>
  </div>

  <div class="subcategory">
    <img src="MINI IMG/REDMI.png" alt="4">
    <a href="redmi.html" class="card">REDMI</a>
  </div>

</div>
</body>
</html>
