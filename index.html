* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  color: #333;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

header {
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 40px;
  position: sticky;
  top: 0;
  z-index: 1000;
  border-bottom: 1px solid #ddd;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

header h1 {
  font-size: 26px;
  font-weight: 700;
  text-transform: uppercase;
  background: linear-gradient(90deg, #ff6ec4, #007bff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo {
  font-size: 18px;
  font-weight: bold;
  color: #007bff;
}

.search {
  flex: 1;
  max-width: 420px;
  padding: 10px 16px;
  margin: 0 25px;
  border: 1px solid #ccc;
  border-radius: 30px;
  font-size: 15px;
  background: #f9f9f9;
  color: #333;
  transition: all 0.3s ease;
}

.search::placeholder {
  color: #888;
}

.search:focus {
  background: #fff;
  border-color: #007bff;
  box-shadow: 0 0 8px rgba(0,123,255,0.4);
  transform: scale(1.03);
  outline: none;
}

.nav-links {
  display: flex;
  gap: 18px;
}

.nav-links a {
  text-decoration: none;
  color: #333;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 10px;
  transition: all 0.25s ease;
}

.nav-links a:hover {
  background: #007bff;
  color: #fff;
  transform: translateY(-2px);
}

main.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 30px;
  padding: 50px 30px;
  transition: opacity 0.3s ease;
}

main.grid.hidden {
  display: none;
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 0;
  background: #fff;
  border-radius: 16px;
  text-decoration: none;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
  overflow: hidden;
  position: relative;
}

.card img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 0;
  margin-bottom: 0;
  transition: transform 0.3s ease;
}

.card .card-title {
  font-size: 20px;
  font-weight: 700;
  color: #333;
  text-align: center;
  padding: 20px;
  width: 100%;
  background: #fff;
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 30px rgba(0,0,0,0.15);
}

.card:hover img {
  transform: scale(1.1);
}

.card:hover .card-title {
  color: #007bff;
}

img.main-img {
  height: 280px;
  width: 280px;
  object-fit: cover;
  display: block;
  margin: 40px auto;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.15);
  transition: all 0.5s ease;
}

img.main-img.hidden {
  display: none;
}

img.main-img:hover {
  transform: scale(1.08);
  box-shadow: 0 14px 40px rgba(0,0,0,0.25);
}

#searchResults {
  padding: 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 30px;
}

.product-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  transition: all 0.3s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

.product-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.15);
}

.product-card img {
  max-width: 100%;
  height: 160px;
  object-fit: contain;
  margin-bottom: 12px;
}

.product-card h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #333;
}

.product-card p {
  font-size: 14px;
  color: #666;
  margin-bottom: 15px;
}

.product-card button {
  margin: 6px;
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  transition: all 0.25s ease;
}

.btn-cart {
  background: #ff9800;
}

.btn-cart:hover {
  background: #e68900;
}

.btn-buy {
  background: #28a745;
}

.btn-buy:hover {
  background: #218838;
}

footer {
  background: #fff;
  padding: 40px 20px;
  margin-top: 60px;
  text-align: center;
  border-top: 1px solid #ddd;
  box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
}

footer p {

footer .socials {

}

footer .socials a {

  color: #333;
  transition: all 0.25s ease;
  text-decoration: none;
}

footer .socials a:hover {
  color: #007bff;
  transform: scale(1.1);
}

function addToCart(name, price) {
  if (!cart[name]) {
    cart[name] = { name, price, quantity: 1 };
  } else {
    cart[name].quantity++;
  }
  alert(name + " added to cart!");
}

function buyNow(name, price) {
  cart[name] = { name, price, quantity: 1 };
  alert("Redirecting to payment for " + name);
}

const searchBar = document.getElementById("searchBar");
const resultsBox = document.getElementById("searchResults");
const categoryGrid = document.getElementById("categoryGrid");
const mainImage = document.getElementById("mainImage");

searchBar.addEventListener("keyup", function() {
  const query = this.value.toLowerCase().trim();
  resultsBox.innerHTML = "";
  
  if (query) {
    categoryGrid.classList.add("hidden");
    mainImage.classList.add("hidden");
    
    const matches = products.filter(p => p.name.toLowerCase().includes(query));
    if (matches.length > 0) {
      matches.forEach(p => {
        const div = document.createElement("div");
        div.classList.add("product-card");
        div.innerHTML = `
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>Price: Rs ${p.price.toLocaleString()}</p>
          <button class="btn-cart" onclick="addToCart('${p.name}', ${p.price})">Add to Cart</button>
          <button class="btn-buy" onclick="buyNow('${p.name}', ${p.price})">Buy Now</button>
        `;
        resultsBox.appendChild(div);
      });
    } else {
      resultsBox.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:#888;'>No products found</p>";
    }
  } else {
    categoryGrid.classList.remove("hidden");
    mainImage.classList.remove("hidden");
  }
});
</script>
</body>
</html>
