<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fashion - Subcategories</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e0f7fa, #fce4ec);
  color: #333;
  line-height: 1.6;
}

header {
  background: linear-gradient(90deg, #2c3e50, #1abc9c);
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 2px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 4px 15px rgba(26, 188, 156, 0.6);
  text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
  padding: 40px 40px;
}

.subcategory {
  background: white;
  border-radius: 14px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);
  text-align: center;
  padding: 20px;
  transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  border: 2px solid transparent;
  position: relative;
  overflow: hidden;
}

.subcategory::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 14px;
  padding: 2px;
  background: linear-gradient(135deg, #1abc9c, #3498db, #9b59b6, #e74c3c, #f1c40f);
  background-size: 300% 300%;
  animation: borderShift 8s linear infinite;
  -webkit-mask: 
    linear-gradient(#fff 0 0) content-box, 
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.subcategory img {
  max-width: 100%;
  height: 160px;
  object-fit: contain;
  border-radius: 10px;
  margin-bottom: 15px;
  transition: transform 0.4s, filter 0.4s;
  box-shadow: 0 4px 12px rgba(52,152,219,0.3);
}

.subcategory:hover img {
  transform: scale(1.07);
  filter: brightness(1.1) saturate(1.2);
  box-shadow: 0 8px 20px rgba(255,111,97,0.6);
}

.subcategory a {
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  color: #2c3e50;
  transition: color 0.3s, text-shadow 0.3s;
}

.subcategory:hover {
  animation: shake 0.4s ease-in-out;
  box-shadow: 0 12px 25px rgba(0,0,0,0.25), 
              0 0 20px rgba(26,188,156,0.4);
  background: linear-gradient(135deg, #f0fdfb, #e8f7ff);
}

.subcategory:hover a {
  color: #e74c3c;
  text-shadow: 0 2px 6px rgba(231,76,60,0.6);
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

@keyframes borderShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@media (max-width: 900px) {
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .container {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>
<body>

<header>
  <h1>Fashion</h1>
</header>

<div class="container">
  <div class="subcategory">
    <img src="MINI IMG/MEN.webp" alt="Men Fashion">
    <a href="Men.html">MEN</a>
    <p>T-Shirts, Shirts, Jeans</p>
  </div>

  <div class="subcategory">
    <img src="MINI IMG/WOMEN.jpg" alt="Women Fashion">
    <a href="Women.html">WOMEN</a>
    <p>Shutis, Sarees, Frock</p>
  </div>

  <div class="subcategory">
    <img src="MINI IMG/CHILDREN.jpg" alt="Children Fashion">
    <a href="Children.html">CHILDREN</a>
    <p>Boys, Girls, Baby's</p>
  </div>
</div>

</body>
</html>
